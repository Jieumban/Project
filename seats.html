<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>座位即時狀態</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 0;
    }

    header {
      background: #333;
      color: white;
      padding: 15px;
      position: relative;
      text-align: center;
    }

    .count {
      position: absolute;
      right: 20px;
      top: 15px;
      font-size: 18px;
    }

    .container {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      padding: 20px;
    }

    .seat {
      background: white;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    .seat-name {
      font-size: 24px;
      margin-bottom: 10px;
    }

    .light {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      margin: 10px auto;
      box-shadow: 0 0 15px;
    }

    .green {
      background: #00c853;
      box-shadow: 0 0 20px #00c853;
    }

    .red {
      background: #d50000;
      box-shadow: 0 0 20px #d50000;
    }

    .info {
      margin-top: 10px;
      font-size: 16px;
    }
  </style>
</head>

<body>

<header>
  <h1>座位即時狀態</h1>
  <div class="count">👤 使用人數：<span id="userCount">0</span></div>
</header>

<div class="container" id="seatContainer">
  <!-- 座位由 JS 產生 -->
</div>

<script>
  // 模擬座位資料（之後可改成 fetch ESP32 API）
  let seats = [
    { id: "A", used: true,  startTime: Date.now() - 5 * 60000 },
    { id: "B", used: false, startTime: null },
    { id: "C", used: true,  startTime: Date.now() - 12 * 60000 },
    { id: "D", used: false, startTime: null }
  ];

  function updateSeats() {
    const container = document.getElementById("seatContainer");
    container.innerHTML = "";

    let usedCount = 0;

    seats.forEach(seat => {
      if (seat.used) usedCount++;

      const div = document.createElement("div");
      div.className = "seat";

      let durationText = "—";
      if (seat.used && seat.startTime) {
        const minutes = Math.floor((Date.now() - seat.startTime) / 60000);
        durationText = minutes + " 分鐘";
      }

      div.innerHTML = `
        <div class="seat-name">座位 ${seat.id}</div>
        <div class="light ${seat.used ? "green" : "red"}"></div>
        <div class="info">
          狀態：${seat.used ? "使用中" : "空閒"}<br>
          已使用時間：${durationText}
        </div>
      `;

      container.appendChild(div);
    });

    document.getElementById("userCount").innerText = usedCount;
  }

  // 每 2 秒更新一次（之後可接即時資料）
  setInterval(updateSeats, 2000);
  updateSeats();
</script>

</body>
</html>
