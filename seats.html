<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>座位即時狀態</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 0;
    }

    header {
      background: #333;
      color: white;
      padding: 15px;
      position: relative;
      text-align: center;
    }

    .count {
      position: absolute;
      right: 20px;
      top: 15px;
      font-size: 18px;
    }

    .container {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      padding: 20px;
    }

    .seat {
      background: white;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    .seat-name {
      font-size: 24px;
      margin-bottom: 10px;
    }

    .light {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      margin: 10px auto;
      box-shadow: 0 0 15px;
    }

    .green {
      background: #00c853;
      box-shadow: 0 0 20px #00c853;
    }

    .red {
      background: #d50000;
      box-shadow: 0 0 20px #d50000;
    }

    .info {
      margin-top: 10px;
      font-size: 16px;
    }
    .back-btn {
      position: fixed;
      top: 15px;
      left: 15px;
      background: #1976d2;
      color: white;
      padding: 8px 14px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      z-index: 999;
    }

    .back-btn:hover {
      background: #0d47a1;
    }

  </style>
</head>

<body>

  <a href="index.html" class="back-btn">← Back to index</a>

<header>
  <h1>座位即時狀態</h1>
  <div class="count">使用人數：<span id="userCount">0</span></div>
</header>

<div class="container" id="seatContainer">
  <!-- 座位由 JS 產生 -->
</div>


<script>
const SEAT_A = { xMin: 0, xMax: 2.5, yMin: 2, yMax: 4 };
const SEAT_B = { xMin: 2.5, xMax: 5, yMin: 2, yMax: 4 };
const SEAT_C = { xMin: 0, xMax: 2.5, yMin: 0, yMax: 2 };
const SEAT_D = { xMin: 2.5, xMax: 5, yMin: 0, yMax: 2 };

let seats = {
  A: { id: "A", area: SEAT_A, occupied: false, inCnt: 0, outCnt: 0, startTime: null },
  B: { id: "B", area: SEAT_B, occupied: false, inCnt: 0, outCnt: 0, startTime: null },
  C: { id: "C", area: SEAT_C, occupied: false, inCnt: 0, outCnt: 0, startTime: null },
  D: { id: "D", area: SEAT_D, occupied: false, inCnt: 0, outCnt: 0, startTime: null }
};

function isInside(x, y, area) {
  return (x >= area.xMin && x <= area.xMax && y >= area.yMin && y <= area.yMax);
}

/* ========= 2. UI 更新邏輯 ========= */
function updateSeatsUI() {
  const container = document.getElementById("seatContainer");
  if (!container) return;
  
  container.innerHTML = "";
  let usedCount = 0;

  Object.values(seats).forEach(seat => {
    if (seat.occupied) usedCount++;

    const div = document.createElement("div");
    div.className = "seat";

    let durationText = "—";
    if (seat.occupied && seat.startTime) {
      const minutes = Math.floor((Date.now() - seat.startTime) / 60000);
      durationText = minutes + " 分鐘";
    }

    div.innerHTML = `
      <div class="seat-name">座位 ${seat.id}</div>
      <div class="light ${seat.occupied ? "green" : "red"}"></div>
      <div class="info">
        狀態：${seat.occupied ? "使用中" : "空閒"}<br>
        已使用時間：${durationText}
      </div>
    `;
    container.appendChild(div);
  });

  document.getElementById("userCount").innerText = usedCount;
}

// 初始畫出介面
updateSeatsUI();
</script>

<script src="./script/update.js"></script>

</body>
</html>
